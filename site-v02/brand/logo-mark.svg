<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="تجذير Root Network mark" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
  <title>Tajzeer — Root Network</title>
  <!-- Root node -->
  <circle cx="20" cy="5" r="2" fill="currentColor" stroke="none" />
  <!-- Trunk -->
  <line x1="20" y1="7" x2="20" y2="12" />
  <!-- Primary branch bar -->
  <line x1="10" y1="12" x2="30" y2="12" />
  <!-- Interconnection between mid nodes: unity across locations -->
  <line x1="12" y1="21" x2="28" y2="21" stroke-dasharray="1.25 2" opacity="0.55" />
  <!-- Left branch drop -->
  <line x1="10" y1="12" x2="10" y2="20" />
  <!-- Right branch drop -->
  <line x1="30" y1="12" x2="30" y2="20" />
  <!-- Mid nodes -->
  <circle cx="10" cy="21" r="1.5" fill="currentColor" stroke="none" />
  <circle cx="30" cy="21" r="1.5" fill="currentColor" stroke="none" />
  <!-- Secondary trunks -->
  <line x1="10" y1="22.5" x2="10" y2="26" />
  <line x1="30" y1="22.5" x2="30" y2="26" />
  <!-- Left mini split -->
  <line x1="5" y1="26" x2="15" y2="26" />
  <line x1="5" y1="26" x2="5" y2="32" />
  <line x1="15" y1="26" x2="15" y2="32" />
  <!-- Right mini split -->
  <line x1="25" y1="26" x2="35" y2="26" />
  <line x1="25" y1="26" x2="25" y2="32" />
  <line x1="35" y1="26" x2="35" y2="32" />
  <!-- Leaves -->
  <circle cx="5" cy="33.5" r="1.25" fill="currentColor" stroke="none" />
  <circle cx="15" cy="33.5" r="1.25" fill="currentColor" stroke="none" />
  <circle cx="25" cy="33.5" r="1.25" fill="currentColor" stroke="none" />
  <circle cx="35" cy="33.5" r="1.25" fill="currentColor" stroke="none" />
</svg>

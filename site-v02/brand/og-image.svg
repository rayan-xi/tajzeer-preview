<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="تجذير — من تدخّل يمرّ إلى قدرة تبقى">
  <title>Tajzeer — Open Graph Card</title>
  <rect width="1200" height="630" fill="#1F3B2E" />
  <!-- Subtle root network watermark -->
  <g stroke="#F5EFE6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.10" transform="translate(720 60) scale(11)">
    <circle cx="20" cy="5" r="2.5" fill="#F5EFE6" stroke="none" />
    <line x1="20" y1="7.5" x2="20" y2="12" />
    <line x1="10" y1="12" x2="30" y2="12" />
    <line x1="10" y1="12" x2="10" y2="20" />
    <line x1="30" y1="12" x2="30" y2="20" />
    <circle cx="10" cy="21" r="2" fill="#F5EFE6" stroke="none" />
    <circle cx="30" cy="21" r="2" fill="#F5EFE6" stroke="none" />
    <line x1="10" y1="23" x2="10" y2="26" />
    <line x1="30" y1="23" x2="30" y2="26" />
    <line x1="5" y1="26" x2="15" y2="26" />
    <line x1="5" y1="26" x2="5" y2="32" />
    <line x1="15" y1="26" x2="15" y2="32" />
    <line x1="25" y1="26" x2="35" y2="26" />
    <line x1="25" y1="26" x2="25" y2="32" />
    <line x1="35" y1="26" x2="35" y2="32" />
    <circle cx="5" cy="33.5" r="1.7" fill="#F5EFE6" stroke="none" />
    <circle cx="15" cy="33.5" r="1.7" fill="#F5EFE6" stroke="none" />
    <circle cx="25" cy="33.5" r="1.7" fill="#F5EFE6" stroke="none" />
    <circle cx="35" cy="33.5" r="1.7" fill="#F5EFE6" stroke="none" />
  </g>
  <!-- Wordmark -->
  <text x="80" y="200" fill="#F5EFE6"
        font-family="'IBM Plex Sans Arabic', 'Tajawal', 'Noto Sans Arabic', system-ui, sans-serif"
        font-weight="700" font-size="120" direction="rtl" letter-spacing="-2">تجذير</text>
  <text x="80" y="260" fill="#F5EFE6" opacity="0.75"
        font-family="'Geist', 'Satoshi', system-ui, sans-serif"
        font-weight="600" font-size="34" letter-spacing="4">TAJZEER</text>
  <!-- Message -->
  <text x="80" y="410" fill="#F5EFE6"
        font-family="'IBM Plex Sans Arabic', 'Tajawal', 'Noto Sans Arabic', system-ui, sans-serif"
        font-weight="500" font-size="52" direction="rtl">من تدخّل يمرّ</text>
  <text x="80" y="475" fill="#F5EFE6"
        font-family="'IBM Plex Sans Arabic', 'Tajawal', 'Noto Sans Arabic', system-ui, sans-serif"
        font-weight="700" font-size="52" direction="rtl">إلى قدرة تبقى.</text>
  <!-- Bottom stripe -->
  <line x1="80" y1="550" x2="500" y2="550" stroke="#8A5A2B" stroke-width="4" />
  <text x="80" y="590" fill="#F5EFE6" opacity="0.7"
        font-family="'IBM Plex Sans Arabic', 'Tajawal', system-ui, sans-serif"
        font-weight="500" font-size="24" direction="rtl">Frontline Performance &amp; Capability Rooting</text>
</svg>

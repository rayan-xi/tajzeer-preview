<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>توقيع البريد الإلكتروني — Signature v1 (Compact)</title>
<!-- Bilingual · Outlook + Gmail + Apple Mail compatible -->
</head>
<body style="margin:0;padding:0;background:#F5EFE6;font-family:'Segoe UI',Tahoma,Arial,sans-serif;">

<!--=== START SIGNATURE ===-->
<!-- Copy from here down to the END SIGNATURE marker -->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#141414;line-height:1.4;">
  <tr>
    <!-- Green root bar -->
    <td width="4" style="width:4px;background-color:#1F3B2E;padding:0;font-size:0;line-height:0;">&nbsp;</td>
    <!-- Spacer -->
    <td width="18" style="width:18px;padding:0;font-size:0;line-height:0;">&nbsp;</td>

    <!-- CONTENT -->
    <td style="padding:6px 0 6px 0;vertical-align:top;">
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;">
        <!-- Name + Role -->
        <tr>
          <td style="padding-bottom:2px;font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:17px;font-weight:700;color:#1F3B2E;line-height:1.25;">
            {{ full_name_ar }}
          </td>
        </tr>
        <tr>
          <td style="padding-bottom:8px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:600;color:#8A5A2B;letter-spacing:1px;text-transform:uppercase;line-height:1.3;">
            {{ role_en }}
          </td>
        </tr>

        <!-- Divider -->
        <tr>
          <td style="border-top:1px solid #E0D7C5;font-size:0;line-height:0;padding:0;">&nbsp;</td>
        </tr>

        <!-- Contact Info -->
        <tr>
          <td style="padding-top:8px;font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:13px;color:#333333;line-height:1.8;">
            <span style="color:#8A5A2B;font-weight:700;">م</span>
            <span style="color:#666666;">·</span>
            <a href="mailto:{{ email }}" style="color:#1F3B2E;text-decoration:none;">{{ email }}</a>
            <br />
            <span style="color:#8A5A2B;font-weight:700;">ج</span>
            <span style="color:#666666;">·</span>
            <a href="tel:{{ phone_tel }}" style="color:#1F3B2E;text-decoration:none;" dir="ltr">{{ phone_display }}</a>
            <br />
            <span style="color:#8A5A2B;font-weight:700;">و</span>
            <span style="color:#666666;">·</span>
            <a href="https://tajzeer.com" style="color:#1F3B2E;text-decoration:none;">tajzeer.com</a>
          </td>
        </tr>

        <!-- Tagline strip -->
        <tr>
          <td style="padding-top:10px;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#8A5A2B;letter-spacing:1.5px;font-weight:600;">
            نبني قدرة تبقى في فروعك.
          </td>
        </tr>
      </table>
    </td>

    <!-- Spacer -->
    <td width="28" style="width:28px;padding:0;font-size:0;line-height:0;">&nbsp;</td>

    <!-- LOGO -->
    <td style="vertical-align:top;padding:4px 0 0 0;">
      <img src="https://rayan-xi.github.io/tajzeer-preview/signature/logo-tajzeer-signature.png"
           alt="تجذير TAJZEER"
           width="72" height="72"
           style="display:block;border:0;width:72px;height:72px;" />
    </td>
  </tr>
</table>
<!--=== END SIGNATURE ===-->

</body>
</html>

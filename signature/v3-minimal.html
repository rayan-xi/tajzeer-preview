<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>توقيع البريد الإلكتروني — Signature v3 (Minimal)</title>
</head>
<body style="margin:0;padding:0;background:#F5EFE6;font-family:'Segoe UI',Tahoma,Arial,sans-serif;">

<!--=== START SIGNATURE ===-->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:#141414;line-height:1.5;">
  <tr>
    <td style="vertical-align:top;padding:0;">
      <table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;">
        <tr>
          <td style="font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:15px;font-weight:700;color:#1F3B2E;padding-bottom:2px;line-height:1.3;">
            {{ full_name_ar }}
          </td>
        </tr>
        <tr>
          <td style="font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:12px;color:#555555;padding-bottom:8px;line-height:1.3;">
            {{ role_ar }}
            <span style="color:#8A5A2B;">·</span>
            <strong style="color:#1F3B2E;">تجذير</strong>
          </td>
        </tr>
        <tr>
          <td style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#333333;line-height:1.7;">
            <a href="mailto:{{ email }}" style="color:#1F3B2E;text-decoration:none;">{{ email }}</a>
            <span style="color:#8A5A2B;">·</span>
            <a href="tel:{{ phone_tel }}" style="color:#1F3B2E;text-decoration:none;" dir="ltr">{{ phone_display }}</a>
            <span style="color:#8A5A2B;">·</span>
            <a href="https://tajzeer.com" style="color:#1F3B2E;text-decoration:none;">tajzeer.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<!--=== END SIGNATURE ===-->

</body>
</html>
